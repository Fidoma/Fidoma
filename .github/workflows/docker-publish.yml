name: Publish Docker image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

concurrency:
  group: docker-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GHCR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/fidoma/fidoma
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Download CI-tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fidoma-image-${{ github.event.workflow_run.head_sha }}
          path: /tmp/fidoma-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load and tag image
        run: |
          docker load --input /tmp/fidoma-image/fidoma-image.tar
          docker tag fidoma:ci "${IMAGE_NAME}:latest"
          docker tag fidoma:ci "${IMAGE_NAME}:sha-${IMAGE_SHA}"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Publish image
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${IMAGE_SHA}"

      - name: Verify anonymous pull
        run: |
          docker logout ghcr.io
          docker image rm "${IMAGE_NAME}:latest" "${IMAGE_NAME}:sha-${IMAGE_SHA}"
          docker pull "${IMAGE_NAME}:sha-${IMAGE_SHA}"
