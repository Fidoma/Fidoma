name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/fidoma/fidoma

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Build production frontend assets
        run: |
          npm ci
          npm run build

      - name: Create installation archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive_name="fidoma-${RELEASE_TAG}"
          mkdir -p "dist/${archive_name}"
          cp install.sh setup.sh compose.production.yaml .env.production.example README.md "dist/${archive_name}/"
          (
            cd dist
            zip -r "${archive_name}.zip" "${archive_name}"
            sha256sum "${archive_name}.zip" > "${archive_name}.zip.sha256"
          )

      - name: Create webhosting archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive_name="fidoma-webhosting-${RELEASE_TAG}"
          staging_dir="dist/${archive_name}"
          mkdir -p "${staging_dir}"
          rsync -a ./ "${staging_dir}/" \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/.claude/' \
            --exclude '/.codex/' \
            --exclude '/.codex-attachments/' \
            --exclude '/.dockerignore' \
            --exclude '/.editorconfig' \
            --exclude '/.env' \
            --exclude '/.env.backup' \
            --exclude '/.env.production' \
            --exclude '/.gitattributes' \
            --exclude '/.gitignore' \
            --exclude '/.mcp.json' \
            --exclude '/.npmrc' \
            --exclude '/AGENTS.md' \
            --exclude '/CLAUDE.md' \
            --exclude '/Dockerfile' \
            --exclude '/boost.json' \
            --exclude '/compose.production.yaml' \
            --exclude '/compose.yaml' \
            --exclude '/dist/' \
            --exclude '/docker/' \
            --exclude '/docs/' \
            --exclude '/node_modules/' \
            --exclude '/package-lock.json' \
            --exclude '/package.json' \
            --exclude '/phpunit.xml' \
            --exclude '/tests/' \
            --exclude '/vite.config.js'
          (
            cd "${staging_dir}"
            zip -qr "../${archive_name}.zip" .
          )
          (
            cd dist
            sha256sum "${archive_name}.zip" > "${archive_name}.zip.sha256"
          )

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "dist/fidoma-${RELEASE_TAG}.zip" \
              "dist/fidoma-${RELEASE_TAG}.zip.sha256" \
              "dist/fidoma-webhosting-${RELEASE_TAG}.zip" \
              "dist/fidoma-webhosting-${RELEASE_TAG}.zip.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/fidoma-${RELEASE_TAG}.zip" \
              "dist/fidoma-${RELEASE_TAG}.zip.sha256" \
              "dist/fidoma-webhosting-${RELEASE_TAG}.zip" \
              "dist/fidoma-webhosting-${RELEASE_TAG}.zip.sha256" \
              --generate-notes \
              --title "Fidoma ${RELEASE_TAG}" \
              --verify-tag
          fi
