<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
    :root {
        color-scheme: light;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
    }

    body {
        display: grid;
        place-items: center;
    }

    img {
        width: clamp(5.5rem, 18vw, 11rem);
        height: auto;
        opacity: .08;
        filter: grayscale(1);
        user-select: none;
    }

    html.dark-mode {
        color-scheme: dark;
    }

    html.dark-mode body {
        background: #202023;
    }

    html.dark-mode img {
        opacity: .15;
        filter: grayscale(1) brightness(1.8);
    }
</style>
<script>
    try {
        if (document.cookie.indexOf('colorMode=dark') > -1
            || (document.cookie.indexOf('colorMode=light') === -1
                && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.className += ' dark-mode';
        }
    } catch (error) {
        // The parent Fidoma frame synchronizes the final theme after loading.
    }
</script>
</head>
<body>
    <img src="images/fidoma-mark.png" alt="">
</body>
</html>
